assemble:
    - fromTask: bootJar
liferay-agileray-oauth-user-agent:
    .serviceAddress: 172.18.0.3:58081
    .serviceScheme: http
    name: Liferay Agileray OAuth Application User Agent
    allowedObjectDefinitionNames:
        - C_AgileReport
    scopes:
        - C_AgileReport.everything
        - C_JiraIntegrationRequest.everything
        - C_JiraIssue.everything
        - C_JiraIssueLabel.everything
        - C_JiraIssueTransition.everything
    type: oAuthApplicationUserAgent
liferay-agileray-request-afteradd:
    name: Liferay Agileray Request Afteradd
    oAuth2ApplicationExternalReferenceCode: liferay-agileray-oauth-user-agent
    resourcePath: /request/afteradd
    type: objectAction